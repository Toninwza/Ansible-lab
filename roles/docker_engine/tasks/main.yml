---
- name: Check if Docker was previously installed on this host
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_binary_check

- name: Check for running containers if Docker already exists
  community.docker.docker_host_info:
    containers: true
  register: existing_containers
  when: docker_binary_check.stat.exists
  ignore_errors: true

- name: Filter out containers not created by Ansible
  ansible.builtin.set_fact:
    unknown_containers: "{{ existing_containers.containers | default([]) | rejectattr('Names', 'search', 'portainer_(server|agent)') | list }}"
  when: docker_binary_check.stat.exists

- name: Stop if this host already has other workloads and override was not confirmed
  ansible.builtin.fail:
    msg: >
      This host ({{ inventory_hostname }}) already has Docker installed
      {% if unknown_containers is defined and unknown_containers | length > 0 %}
      and {{ unknown_containers | length }} container(s) not created by Ansible were found
      {% endif %}
      — if this is intentional, pass target_confirm_docker_overwrite=true.
  when:
    - docker_binary_check.stat.exists
    - target_confirm_docker_overwrite | default(false) | bool == false

- name: Clean old docker repo files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    - /etc/apt/keyrings/docker.asc
    - /etc/apt/keyrings/docker.gpg

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-docker
      - python3-requests
    state: present
    update_cache: yes

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: {{ ansible_architecture | replace('x86_64', 'amd64') }}
      Signed-By: /etc/apt/keyrings/docker.asc
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'

- name: Create /etc/docker directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'
    
- name: Configure Docker daemon
  ansible.builtin.copy:
    content: |
      {
        "default-address-pools": [{"base":"172.29.2.0/16","size":24}],
        "bip": "172.29.2.1/24",
        "log-driver": "json-file",
        "log-opts": {"max-size": "100m", "max-file": "5"}
      }
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: Restart Docker

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: yes

- name: Ensure Docker is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: Create standard app directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt-apps
    - /mnt-dbs

