---
# Matches guide book step: `docker volume create portainer_data`
# Using a real named Docker volume instead of a bind-mount path, so the
# server role no longer depends on /mnt-apps for its data storage.
- name: Create Portainer data volume
  community.docker.docker_volume:
    name: portainer_data

# Idempotency: check if a container with this name already exists, skip creation if so
- name: Check if Portainer Server container already exists
  community.docker.docker_container_info:
    name: portainer_server
  register: portainer_server_info
  failed_when: false

# Bumped to :lts (2.39.x+) specifically to get --no-setup-token support, which lets
# us skip the ephemeral setup_token flow entirely on a trusted private network and
# create the admin account via a normal API call instead of a password file on disk.
- name: Run Portainer Server container
  community.docker.docker_container:
    name: portainer_server
    image: "portainer/portainer-ce:lts"
    command: "--no-setup-token"
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart_policy: always
    recreate: false
  when: not portainer_server_info.exists

# Must wait for the container to be ready to accept requests before calling the API
- name: Wait for Portainer Server API to be ready
  ansible.builtin.uri:
    url: "https://localhost:9443/api/system/status"
    validate_certs: false
    status_code: [200, 201, 202, 204]
  register: portainer_status
  until: portainer_status.status == 200
  retries: 15
  delay: 5

# Public, unauthenticated endpoint Portainer's own web UI uses to decide whether to
# show the "create admin" wizard or the login page: 404 = no admin yet, 204 = admin exists.
- name: Check if admin account already exists
  ansible.builtin.uri:
    url: "https://localhost:9443/api/users/admin/check"
    method: GET
    validate_certs: false
    status_code: [204, 404]
  register: portainer_admin_check

- name: Log admin check result
  ansible.builtin.debug:
    msg: "Admin account check for {{ inventory_hostname }} — status: {{ portainer_admin_check.status }} ({{ 'already exists' if portainer_admin_check.status == 204 else 'not created yet' }})"

# This is the same endpoint the browser's first-time setup form submits to —
# password goes over HTTPS in the request body only, never touches disk.
# Only reachable while no admin exists yet (that's what --no-setup-token opened up
# without needing to scrape the setup_token out of docker logs within 5 minutes).
- name: Initialize Portainer admin account via API
  ansible.builtin.uri:
    url: "https://localhost:9443/api/users/admin/init"
    method: POST
    validate_certs: false
    body_format: json
    body:
      Username: "admin"
      Password: "{{ lookup('env', 'portainer_admin_password') }}"
    status_code: [200, 201, 202, 204]
  when: portainer_admin_check.status == 404
  #no_log: true

- name: Log admin init result (no secret included)
  ansible.builtin.debug:
    msg: "Admin account created for {{ inventory_hostname }}"
  when: portainer_admin_check.status == 404

- name: Authenticate to Portainer to get JWT
  ansible.builtin.uri:
    url: "https://localhost:9443/api/auth"
    method: POST
    validate_certs: false
    body_format: json
    body:
      username: "admin"
      password: "{{ lookup('env', 'portainer_admin_password') }}"
    status_code: [200, 201, 202, 204]
  register: portainer_auth
  #no_log: true

- name: Log authenticate result (no secret included)
  ansible.builtin.debug:
    msg: "Authenticated to Portainer — status: {{ portainer_auth.status | default('failed') }}"

# Portainer only shows the raw token once, at creation time (can't be retrieved again)
# so we don't check for an existing token — create a new one every run and delete the old one to avoid buildup
- name: List existing tokens to clean up old ones from previous runs
  ansible.builtin.uri:
    url: "https://localhost:9443/api/users/1/tokens"
    method: GET
    validate_certs: false
    headers:
      Authorization: "Bearer {{ portainer_auth.json.jwt }}"
    status_code: [200, 201, 202, 204]
  register: portainer_existing_tokens
  #no_log: true

- name: Remove old ansible-provisioning tokens
  ansible.builtin.uri:
    url: "https://localhost:9443/api/users/1/tokens/{{ item.id }}"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: "Bearer {{ portainer_auth.json.jwt }}"
    status_code: [200, 201, 202, 204]
  loop: "{{ portainer_existing_tokens.json | selectattr('description', 'equalto', 'ansible-provisioning') | list }}"
  loop_control:
    label: "{{ item.description }}"
  #no_log: true

- name: Log number of old tokens removed (no secret included)
  ansible.builtin.debug:
    msg: "Removed {{ portainer_existing_tokens.json | selectattr('description', 'equalto', 'ansible-provisioning') | list | length }} old ansible-provisioning tokens"

- name: Create a fresh API access token for this run
  ansible.builtin.uri:
    url: "https://localhost:9443/api/users/1/tokens"
    method: POST
    validate_certs: false
    headers:
      Authorization: "Bearer {{ portainer_auth.json.jwt }}"
    body_format: json
    body:
      description: "ansible-provisioning"
      password: "{{ lookup('env', 'portainer_admin_password') }}"
    status_code: [200, 201, 202, 204]
  register: portainer_new_token
  #no_log: true

# Store the token as a fact for the portainer_agent role (runs next in the same play) to use
- name: Set fact for local Portainer API token
  ansible.builtin.set_fact:
    portainer_local_token: "{{ portainer_new_token.json.rawAPIKey }}"
  #no_log: true

- name: Log that a new token was created successfully (no secret included)
  ansible.builtin.debug:
    msg: "New API token created and set as fact for downstream roles"