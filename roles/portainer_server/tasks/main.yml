---
- name: Create Portainer Server data directory
  ansible.builtin.file:
    path: /mnt-apps/portainer-server/data
    state: directory
    mode: '0755'

# Current Portainer versions (2.21.0) enforce a setup_token on first boot
# (must be grabbed from docker logs within 5 minutes) — automation avoids this step
# by pre-setting the admin password via --admin-password-file instead, which skips setup_token entirely
- name: Write admin password to a local file for the container to read
  ansible.builtin.copy:
    content: "{{ lookup('env', 'portainer_admin_password') }}"
    dest: /mnt-apps/portainer-server/admin_password
    mode: '0600'
  no_log: true

- name: Log admin password write result (no secret included)
  ansible.builtin.debug:
    msg: "Admin password file written to /mnt-apps/portainer-server/admin_password"

# Idempotency: check if a container with this name already exists, skip creation if so
- name: Check if Portainer Server container already exists
  community.docker.docker_container_info:
    name: portainer_server
  register: portainer_server_info
  failed_when: false

- name: Run Portainer Server container
  community.docker.docker_container:
    name: portainer_server
    image: "portainer/portainer-ce:2.21.4"
    command: "--admin-password-file /run/secrets/admin_password"
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt-apps/portainer-server/data:/data
      - /mnt-apps/portainer-server/admin_password:/run/secrets/admin_password:ro
    restart_policy: always
    recreate: false
  when: not portainer_server_info.exists

# Must wait for the container to be ready to accept requests before calling the API
- name: Wait for Portainer Server API to be ready
  ansible.builtin.uri:
    url: "https://localhost:9443/api/system/status"
    validate_certs: false
    status_code: [200, 201, 202, 204]
  register: portainer_status
  until: portainer_status.status == 200
  retries: 15
  delay: 5

# No "Initialize admin account" task needed anymore — --admin-password-file
# sets the admin account at boot already, no web UI, no setup_token needed
- name: Authenticate to Portainer to get JWT
  ansible.builtin.uri:
    url: "https://localhost:9443/api/auth"
    method: POST
    validate_certs: false
    body_format: json
    body:
      username: "admin"
      password: "{{ lookup('env', 'portainer_admin_password') }}"
    status_code: [200, 201, 202, 204]
  register: portainer_auth
  no_log: true

- name: Log authenticate result (no secret included)
  ansible.builtin.debug:
    msg: "Authenticated to Portainer — status: {{ portainer_auth.status | default('failed') }}"

# Portainer only shows the raw token once, at creation time (can't be retrieved again)
# so we don't check for an existing token — create a new one every run and delete the old one to avoid buildup
- name: List existing tokens to clean up old ones from previous runs
  ansible.builtin.uri:
    url: "https://localhost:9443/api/users/1/tokens"
    method: GET
    validate_certs: false
    headers:
      Authorization: "Bearer {{ portainer_auth.json.jwt }}"
    status_code: [200, 201, 202, 204]
  register: portainer_existing_tokens
  no_log: true

- name: Remove old ansible-provisioning tokens
  ansible.builtin.uri:
    url: "https://localhost:9443/api/users/1/tokens/{{ item.id }}"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: "Bearer {{ portainer_auth.json.jwt }}"
    status_code: [200, 201, 202, 204]
  loop: "{{ portainer_existing_tokens.json | selectattr('description', 'equalto', 'ansible-provisioning') | list }}"
  loop_control:
    label: "{{ item.description }}"
  no_log: true

- name: Log number of old tokens removed (no secret included)
  ansible.builtin.debug:
    msg: "Removed {{ portainer_existing_tokens.json | selectattr('description', 'equalto', 'ansible-provisioning') | list | length }} old ansible-provisioning tokens"

- name: Create a fresh API access token for this run
  ansible.builtin.uri:
    url: "https://localhost:9443/api/users/1/tokens"
    method: POST
    validate_certs: false
    headers:
      Authorization: "Bearer {{ portainer_auth.json.jwt }}"
    body_format: json
    body:
      description: "ansible-provisioning"
      password: "{{ lookup('env', 'portainer_admin_password') }}"
    status_code: [200, 201, 202, 204]
  register: portainer_new_token
  no_log: true

# Store the token as a fact for the portainer_agent role (runs next in the same play) to use
- name: Set fact for local Portainer API token
  ansible.builtin.set_fact:
    portainer_local_token: "{{ portainer_new_token.json.rawAPIKey }}"
  no_log: true

- name: Log that a new token was created successfully (no secret included)
  ansible.builtin.debug:
    msg: "New API token created and set as fact for downstream roles"