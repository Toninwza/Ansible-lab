# roles/nginx_proxy/tasks/main.yml
---
- name: Create Nginx infrastructure directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ nginx_proxy_dest_dir }}/nginx"
    - "{{ nginx_proxy_dest_dir }}/vhost.d"
    - /var/log/nginx/reverse-proxy
    - "{{ nginx_proxy_cert_dir }}"

- name: Copy SSL certificates
  ansible.builtin.copy:
    src: "{{ nginx_proxy_cert_src_dir }}/{{ item }}"   
    dest: "{{ nginx_proxy_cert_dir }}/{{ item }}"       
    mode: '0644'
  loop: "{{ nginx_proxy_cert_files }}"

- name: Copy Nginx config files
  ansible.builtin.copy:
    src: "{{ nginx_proxy_config_src_dir }}/nginx/{{ item }}"
    dest: "{{ nginx_proxy_dest_dir }}/nginx/{{ item }}"
    mode: '0644'
  loop:
    - proxy.conf
    - proxy-wide.conf

- name: Copy vhost.d configurations
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ nginx_proxy_dest_dir }}/vhost.d/{{ item | basename }}"
    mode: '0644'
  loop: "{{ lookup('fileglob', nginx_proxy_config_src_dir + '/vhost.d/*', wantlist=True) }}"

- name: Create Docker network nginx_proxy
  community.docker.docker_network:
    name: "nginx_proxy"
    state: present

- name: Deploy Nginx Proxy compose file
  ansible.builtin.copy:
    src: "{{ nginx_proxy_config_src_dir }}/{{ nginx_proxy_compose_file }}"
    dest: "{{ nginx_proxy_dest_dir }}/{{ nginx_proxy_compose_file }}"
    mode: '0644'

- name: Run Nginx Proxy via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ nginx_proxy_dest_dir }}"
    state: present

- name: Create logrotate config for nginx
  ansible.builtin.copy:
    content: |
      /var/log/nginx/reverse-proxy/*.log {
              monthly
              rotate 12
              compress
              delaycompress
              missingok
              notifempty
              create 644 root root
      }
    dest: /etc/logrotate.d/nginx-reverse-proxy-log
    mode: '0644'