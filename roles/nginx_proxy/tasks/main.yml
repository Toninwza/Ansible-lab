#     mode: '0644'
#   when: lookup('fileglob', role_path + '/files/vhost.d/*') | length > 0

- name: Create Docker network nginx_proxy
  community.docker.docker_network:
    name: "{{ docker_network_name }}"
    state: present

- name: Run Nginx Proxy container
  community.docker.docker_container:
    name: nginx-proxy
    image: "nginxproxy/nginx-proxy:{{ nginx_proxy_version }}"
    ports:
      - "82:82"
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /opt/supalai-nginx/nginx/proxy.conf:/etc/nginx/proxy.conf
      - /opt/supalai-nginx/nginx/proxy-wide.conf:/etc/nginx/conf.d/my_proxy.conf:ro
      - /var/log/nginx/reverse-proxy:/var/log/nginx
      - /opt/supalai-nginx/vhost.d:/etc/nginx/vhost.d:ro
    env:
      TZ: "Asia/Bangkok"
      ENABLE_IPV6: "true"
    networks:
      - name: "{{ docker_network_name }}"
    restart_policy: always
    recreate: false

- name: Create logrotate config for nginx
  ansible.builtin.copy:
    content: |
      /var/log/nginx/reverse-proxy/*.log {
              monthly
              rotate 12
              compress
              delaycompress
              missingok
              notifempty
              create 644 root root
      }
    dest: /etc/logrotate.d/nginx-reverse-proxy-log
    mode: '0644'