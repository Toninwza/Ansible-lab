- name: Copy Nginx config files
  ansible.builtin.copy:
    src: "nginx/{{ item }}"
    dest: "/opt/supalai-nginx/nginx/{{ item }}"
    mode: '0644'
  loop:
    - proxy.conf
    - proxy-wide.conf

# TODO: vhost.d ยังไม่ใช้ตอนนี้
# - name: Copy vhost.d configurations
#   ansible.builtin.copy:
