# roles/nginx_proxy/tasks/main.yml
---
- name: Create Nginx infrastructure directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/supalai-nginx/nginx
    - /opt/supalai-nginx/vhost.d
    - /var/log/nginx/reverse-proxy
    - /etc/ssl/supalai_cert

# TODO: cert จะถือโดยคนอื่น รอ task แยกมาทีหลัง
