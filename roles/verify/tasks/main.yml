---
- name: Check Docker service is active
  ansible.builtin.systemd:
    name: docker
  register: verify_docker_status
  failed_when: verify_docker_status.status.ActiveState != "active"

- name: Check nginx is responding
  ansible.builtin.uri:
    # kics-scan ignore-line
    url: "http://127.0.0.1:82/nginx_status"
    status_code: 200
  register: verify_nginx_status
  retries: 6
  delay: 5
  until: verify_nginx_status is succeeded
  when: install_nginx_proxy | default(false) | bool

- name: Check Portainer Server is responding
  ansible.builtin.uri:
    url: "https://127.0.0.1:9443/api/system/status"
    validate_certs: false
    status_code: 200
  register: verify_portainer_status
  retries: 6
  delay: 5
  until: verify_portainer_status is succeeded
  when: install_portainer_server | default(false) | bool
