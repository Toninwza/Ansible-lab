---
- name: Register target host
  hosts: localhost              # ← รันบนตัวเอง ไม่ต้องรู้ IP ก่อน
  tasks:
    - add_host:
        name: "{{ target_host }}"   # ← ตอนนี้รู้ค่าแล้ว ใส่ใน memory

- name: On-demand server provisioning
  hosts: dynamic               # ← ไปหยิบจาก memory แทน

  roles:
    - role: docker_engine
      when: install_docker | bool or install_nginx_proxy | bool or install_portainer_agent | bool

    - role: nginx_proxy
      when: install_nginx_proxy | bool

    - role: portainer_agent
      when: install_portainer_agent | bool

    - role: verify
      when: install_docker | bool or install_nginx_proxy | bool or install_portainer_agent | bool