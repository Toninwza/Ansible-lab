name: "Molecule (full)"

# ทดสอบทุก role ที่มี scenario ใน molecule/ (สแกนเต็ม)
# กดรันเองจากหน้า Actions -> "Molecule (full)" -> Run workflow (เลือก branch ได้)
# ส่วน workflow หลัก (ansible-ci.yml) ทดสอบเฉพาะ role ที่ถูกแก้

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molecule-full-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  list:
    name: list all scenarios
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: List scenarios
        id: list
        run: |
          # ไม่ส่ง base = รันทุก scenario
          scenarios=$(.github/scripts/detect-molecule-scenarios.sh "")
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          {
            echo "## Molecule scenarios (full)"
            echo
            echo "\`$scenarios\`"
          } >> "$GITHUB_STEP_SUMMARY"

  molecule:
    needs: list
    if: needs.list.outputs.scenarios != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.list.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-molecule.txt
      - name: Install tools
        run: pip install -r requirements-ci.txt -r requirements-molecule.txt
      - name: Install collections
        run: |
          ansible-galaxy collection install -r collections/requirements.yml -p collections
          ansible-galaxy collection install -r molecule/requirements.yml -p collections
      - name: molecule test (${{ matrix.scenario }})
        run: molecule test -s "${{ matrix.scenario }}"
