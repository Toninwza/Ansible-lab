name: "Ansible Full Scan"

# สแกนเต็มทุกอย่าง ตอนนี้กดรันเองเท่านั้น (Actions > Ansible Full Scan > Run workflow)
# - molecule ทุก role (แยก job ละ role ให้รันพร้อมกัน)
# - CVE ใน container image ที่ role ใช้ (Trivy)
# - CVE ใน python package ของ CI (pip-audit)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
  # aquasec/trivy:0.58.1
  TRIVY_IMAGE: aquasec/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  roles:
    name: "1. List roles"
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: "Setup › Checkout code"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Plan › List roles to test"
        id: list
        run: |
          skip=$(grep -vE '^\s*(#|$)' molecule/skip-roles.txt | awk '{print $1}')
          list=$(for d in roles/*/tasks; do basename "$(dirname "$d")"; done \
            | grep -vxF -f <(echo "$skip") | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          {
            echo "## Molecule: ทุก role"
            echo "- เทส: \`$list\`"
            echo "- ข้าม (molecule/skip-roles.txt):"
            grep -vE '^\s*(#|$)' molecule/skip-roles.txt | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"

  molecule:
    needs: roles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.roles.outputs.list) }}
    name: "2. Molecule (${{ matrix.role }})"
    steps:
      - name: "Setup › Checkout code"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Setup › Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-molecule.txt
      - name: "Setup › Install tools and collections"
        run: |
          pip install -r requirements-molecule.txt
          ansible-galaxy collection install -r collections/requirements.yml -p collections
      - name: "Test › molecule test"
        env:
          MOLECULE_ROLE: ${{ matrix.role }}
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"
        run: |
          portainer_admin_password="$(openssl rand -base64 24)"
          echo "::add-mask::$portainer_admin_password"
          export portainer_admin_password
          molecule test

  # ยังไม่ทำให้แดง (exit-code 0) ดูผลใน summary ก่อน แล้วค่อยเปลี่ยนเป็น --exit-code 1
  images:
    name: "3. Image CVEs (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: "Setup › Checkout code"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Scan › Trivy (images used by roles)"
        run: |
          imgs=$(grep -rhoE '^\s*image:\s*"?[^"[:space:]]+' roles --include='*.yml' \
            | sed -E 's/^\s*image:\s*"?//' | grep -v '{{' | sort -u)
          mkdir -p trivy-results
          {
            echo "## Trivy: ช่องโหว่ใน container image (HIGH/CRITICAL ที่มี fix แล้ว)"
            echo
            echo "| image | CRITICAL | HIGH |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for img in $imgs; do
            name="$(echo "$img" | tr '/:' '__').json"
            docker run --rm -v "$PWD/trivy-results:/out" "$TRIVY_IMAGE" image --quiet \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
              --format json --output "/out/$name" "$img"
            c=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "trivy-results/$name")
            h=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "trivy-results/$name")
            echo "| \`$img\` | $c | $h |" >> "$GITHUB_STEP_SUMMARY"
            [ "$c" -eq 0 ] || echo "::warning::$img has $c CRITICAL vulnerabilities with a fix available"
          done
      - name: "Report › Save results (artifact)"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-results
          path: trivy-results

  deps:
    name: "4. Python CVEs (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - name: "Setup › Checkout code"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Setup › Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Scan › pip-audit (requirements-molecule.txt)"
        run: |
          pip install "pip-audit==$PIP_AUDIT_VERSION"
          pip-audit -r requirements-molecule.txt
