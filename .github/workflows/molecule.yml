name: "Molecule"

# ทดสอบ role ด้วย molecule เฉพาะ role ที่ถูกแก้ใน commit / PR นั้น
# กติกาการเลือก role อยู่ใน .github/scripts/detect-molecule-scenarios.sh

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch: # กดรันเองจากหน้า Actions = รันทุก scenario

permissions:
  contents: read

concurrency:
  group: molecule-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  detect:
    name: detect changed roles
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.detect.outputs.scenarios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # ต้องมี history ไว้ git diff
      - name: Pick scenarios from changed files
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;; # workflow_dispatch -> รันทุก scenario
          esac
          scenarios=$(.github/scripts/detect-molecule-scenarios.sh "$base")
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          {
            echo "## Molecule scenarios"
            echo
            echo "\`$scenarios\`"
          } >> "$GITHUB_STEP_SUMMARY"

  molecule:
    needs: detect
    if: needs.detect.outputs.scenarios != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.detect.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-molecule.txt
      - name: Install tools
        run: pip install -r requirements-ci.txt -r requirements-molecule.txt
      - name: Install collections
        run: |
          ansible-galaxy collection install -r collections/requirements.yml -p collections
          ansible-galaxy collection install -r molecule/requirements.yml -p collections
      - name: molecule test (${{ matrix.scenario }})
        run: molecule test -s "${{ matrix.scenario }}"

  # ใช้ job นี้เป็น required check ใน branch protection
  # (job molecule ราย role จะไม่เกิดขึ้นถ้า commit ไม่ได้แตะ role นั้น)
  result:
    name: molecule result
    needs: [detect, molecule]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check molecule result
        env:
          DETECT: ${{ needs.detect.result }}
          MOLECULE: ${{ needs.molecule.result }}
          SCENARIOS: ${{ needs.detect.outputs.scenarios }}
        run: |
          echo "detect=$DETECT molecule=$MOLECULE scenarios=$SCENARIOS"
          [ "$DETECT" = success ] || { echo "detect job ไม่สำเร็จ"; exit 1; }
          case "$MOLECULE" in
            success) echo "ผ่านทุก scenario" ;;
            skipped) echo "ไม่มี role ที่ต้องทดสอบใน commit นี้" ;;
            *) echo "molecule: $MOLECULE"; exit 1 ;;
          esac
