name: "Ansible Security Scan"

# flow หลัก: รันทุก push / PR เป็นด่านที่ต้องผ่าน
# งานหนัก (molecule ทุก role, สแกน image, pip-audit) อยู่ใน full-scan.yml

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ให้ ansible หา collection จาก ./collections เสมอ ไม่ว่า ansible.cfg จะตั้งอะไรไว้
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
  # pin ด้วย digest ที่ได้จาก log ของรันแรก (วันที่ 2026-11-03)
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  KICS_IMAGE: checkmarx/kics@sha256:ef29dbac14b046b1ef65f3280646112e927a61781c5f01bca1aeb723e0b96003
  CHECKOV_VERSION: "3.4.3"
  ZIZMOR_VERSION: "1.32.0"

jobs:
  # yamllint + zizmor + ansible-lint (ทำ syntax-check ให้ด้วย) + เช็กว่า dependency pin แล้ว
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install tools
        run: pip install -r requirements-ci.txt "zizmor==$ZIZMOR_VERSION"
      - name: Install collections
        run: ansible-galaxy collection install -r collections/requirements.yml -p collections
      - name: yamllint (workflow + molecule files)
        run: yamllint .github molecule
      - name: zizmor (workflow security)
        if: ${{ !cancelled() }}
        run: zizmor --offline .github/workflows
      - name: ansible-lint
        if: ${{ !cancelled() }}
        run: ansible-lint
      - name: dependencies must be pinned
        if: ${{ !cancelled() }}
        run: |
          bad=$(grep -hvE '^\s*(#|-r |$)' requirements-*.txt | grep -vE '^[][A-Za-z0-9_.-]+==[0-9][^ ]*$' || true)
          [ -z "$bad" ] || { echo "::error::python requirements not pinned with ==:"; echo "$bad"; exit 1; }
          python3 - <<'EOF'
          import re, sys, yaml
          cols = yaml.safe_load(open("collections/requirements.yml")).get("collections", [])
          bad = [c if isinstance(c, str) else c.get("name") for c in cols
                 if isinstance(c, str) or not re.fullmatch(r"\d+\.\d+\.\d+", str(c.get("version", "")))]
          if bad:
              print(f"::error::collections without an exact x.y.z version: {bad}")
              sys.exit(1)
          print(f"{len(cols)} collection(s) pinned")
          EOF

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source /repo --redact --no-banner
      - name: vault files must be encrypted
        run: |
          files=$(git ls-files '*vault*.yml' '*vault*.yaml')
          [ -z "$files" ] && exit 0
          bad=$(grep -L '^\$ANSIBLE_VAULT' $files || true)
          [ -z "$bad" ] || { echo "Unencrypted vault files:"; echo "$bad"; exit 1; }

  # config ที่ไม่ปลอดภัย: KICS + Checkov (ทับกันบางส่วน ดู docs/security-scan.md)
  iac-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: KICS
        id: kics
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" "$KICS_IMAGE" scan \
            -p /src --type ansible --fail-on critical,high \
            --exclude-paths /src/collections/ansible_collections \
            -o /src/scan-results/kics --report-formats "json,sarif"
      # ข้ามรายจุดด้วย "# checkov:skip=<id>:<เหตุผล>" ใน task ไม่ใช้ --skip-check ทั้ง repo
      - name: Checkov
        id: checkov
        if: ${{ !cancelled() }}
        run: |
          pip install "checkov==$CHECKOV_VERSION"
          mkdir -p scan-results
          checkov -d . --framework ansible --skip-path collections --compact \
            -o cli -o sarif --output-file-path console,scan-results/checkov.sarif
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          KICS_OUTCOME: ${{ steps.kics.outcome }}
          CHECKOV_OUTCOME: ${{ steps.checkov.outcome }}
        run: |
          f=scan-results/kics/results.json
          {
            echo "## IaC scan"
            echo "KICS: **$KICS_OUTCOME** · Checkov: **$CHECKOV_OUTCOME** (รายละเอียดของ Checkov อยู่ใน log ของ step)"
            if [ -f "$f" ]; then
              echo
              echo "| KICS ระดับ | ปัญหา | ไฟล์:บรรทัด |"
              echo "| --- | --- | --- |"
              jq -r '
                (.queries // [])
                | sort_by({"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"INFO":4}[.severity])
                | .[] | . as $q | .files[]
                | "| \($q.severity) | \($q.query_name) | `\(.file_name | sub("^(\\.\\./)*/?src/"; "")):\(.line)` |"
              ' "$f"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: iac-scan-results
          path: scan-results
      # ส่งผลเข้า Security > Code scanning และขึ้นตรงบรรทัดใน PR
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() && steps.kics.outcome != 'skipped' }}
        with:
          sarif_file: scan-results/kics/results.sarif
          category: kics
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() && steps.checkov.outcome != 'skipped' }}
        with:
          sarif_file: scan-results/checkov.sarif
          category: checkov

  # เทสเฉพาะ role ที่เปลี่ยน (push: เทียบกับ commit ก่อนหน้า, PR: เทียบกับ base branch)
  # ถ้าอยากเทสทุก role ให้กดรัน full-scan.yml
  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: find changed roles
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$EVENT" in
            push) base="$BEFORE" ;;
            pull_request) base=$(git merge-base "origin/$BASE_REF" HEAD) ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || echo "$base" | grep -qE '^0+$' || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # branch ใหม่ หรือกดรันเอง: เทียบกับ commit ก่อนหน้า
            base=$(git rev-parse HEAD~1 2>/dev/null || true)
          fi
          changed=$( [ -n "$base" ] && git diff --name-only "$base" HEAD || true )
          skip=$(grep -vE '^\s*(#|$)' molecule/skip-roles.txt | awk '{print $1}')
          roles=""
          for r in $(echo "$changed" | sed -nE 's#^roles/([^/]+)/.*#\1#p' | sort -u); do
            [ -d "roles/$r/tasks" ] || continue
            if echo "$skip" | grep -qx "$r"; then echo "::notice::skip $r (molecule/skip-roles.txt)"; continue; fi
            roles="$roles $r"
          done
          if echo "$changed" | grep -qE '^(molecule/|requirements-|collections/requirements\.yml)'; then
            echo "::warning::shared test setup changed; run full-scan.yml to test every role"
          fi
          echo "roles=${roles# }" >> "$GITHUB_OUTPUT"
          echo "## Molecule: ${roles:- (ไม่มี role ที่เปลี่ยน)}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ steps.plan.outputs.roles != '' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-molecule.txt
      - name: Install tools
        if: ${{ steps.plan.outputs.roles != '' }}
        run: |
          pip install -r requirements-molecule.txt
          ansible-galaxy collection install -r collections/requirements.yml -p collections
      - name: molecule test
        if: ${{ steps.plan.outputs.roles != '' }}
        env:
          ROLES: ${{ steps.plan.outputs.roles }}
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"
        run: |
          # รหัสผ่านใช้แล้วทิ้งสำหรับ portainer ใน container ทดสอบเท่านั้น
          portainer_admin_password="$(openssl rand -base64 24)"
          echo "::add-mask::$portainer_admin_password"
          export portainer_admin_password
          failed=""
          for role in $ROLES; do
            echo "::group::molecule test ($role)"
            MOLECULE_ROLE="$role" molecule test || failed="$failed $role"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::molecule failed:$failed"; exit 1; }
