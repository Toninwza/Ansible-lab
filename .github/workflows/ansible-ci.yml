name: "Ansible Security Scan"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ให้ ansible หา collection จาก ./collections เสมอ ไม่ว่า ansible.cfg จะตั้งอะไรไว้
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
  # รอบแรกใช้ latest เพื่อให้รันผ่านก่อน จากนั้นดูเวอร์ชันที่ log พิมพ์ แล้ว pin เป็น tag เฉพาะ
  GITLEAKS_IMAGE: zricethezav/gitleaks:latest
  KICS_IMAGE: checkmarx/kics:latest

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # TODO: pin เป็น commit SHA
      - uses: actions/setup-python@v5 # TODO: pin เป็น commit SHA
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install tools
        run: pip install -r requirements-ci.txt
      - name: Install collections
        run: ansible-galaxy collection install -r collections/requirements.yml -p collections
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint
      - name: syntax-check
        run: |
          for f in playbooks/*.yml playbooks/*.yaml; do
            [ -f "$f" ] || continue
            echo "== $f"
            ansible-playbook "$f" --syntax-check -i localhost,
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # TODO: pin เป็น commit SHA
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source /repo --redact --no-banner
      - name: vault files must be encrypted
        run: |
          files=$(git ls-files '*vault*.yml' '*vault*.yaml')
          [ -z "$files" ] && exit 0
          bad=$(grep -L '^\$ANSIBLE_VAULT' $files || true)
          [ -z "$bad" ] || { echo "Unencrypted vault files:"; echo "$bad"; exit 1; }

  kics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # TODO: pin เป็น commit SHA
      - name: KICS scan
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" "$KICS_IMAGE" scan \
            -p /src --type ansible --fail-on high \
            --exclude-paths /src/collections/ansible_collections \
            -o /src/kics-results --report-formats "json,sarif"
      - uses: actions/upload-artifact@v4 # TODO: pin เป็น commit SHA
        if: always()
        with:
          name: kics-results
          path: kics-results