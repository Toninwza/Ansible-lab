name: "Ansible Security Scan"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ให้ ansible หา collection จาก ./collections เสมอ ไม่ว่า ansible.cfg จะตั้งอะไรไว้
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
  # pin ด้วย digest ที่ได้จาก log ของรันแรก (วันที่ 2026-11-03)
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  KICS_IMAGE: checkmarx/kics@sha256:ef29dbac14b046b1ef65f3280646112e927a61781c5f01bca1aeb723e0b96003

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install tools
        run: pip install -r requirements-ci.txt
      - name: Install collections
        run: ansible-galaxy collection install -r collections/requirements.yml -p collections
      - name: yamllint (workflow files)
        run: yamllint .github
      - name: ansible-lint
        if: ${{ !cancelled() }}
        run: ansible-lint
      - name: syntax-check
        if: ${{ !cancelled() }}
        run: |
          for f in playbooks/*.yml playbooks/*.yaml; do
            [ -f "$f" ] || continue
            echo "== $f"
            ansible-playbook "$f" --syntax-check -i localhost,
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source /repo --redact --no-banner
      - name: vault files must be encrypted
        run: |
          files=$(git ls-files '*vault*.yml' '*vault*.yaml')
          [ -z "$files" ] && exit 0
          bad=$(grep -L '^\$ANSIBLE_VAULT' $files || true)
          [ -z "$bad" ] || { echo "Unencrypted vault files:"; echo "$bad"; exit 1; }

  kics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: KICS scan
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" "$KICS_IMAGE" scan \
            -p /src --type ansible --fail-on critical,high \
            --exclude-paths /src/collections/ansible_collections \
            -o /src/kics-results --report-formats "json,sarif"
      - name: KICS summary
        if: always()
        run: |
          f=kics-results/results.json
          if [ ! -f "$f" ]; then
            echo "KICS: ไม่พบ $f" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## KICS scan"
            echo
            echo "| ระดับ | จำนวน |"
            echo "| --- | --- |"
            jq -r '(.severity_counters // {}) | to_entries[] | "| \(.key) | \(.value) |"' "$f"
            echo
            echo "| ระดับ | ปัญหา | ไฟล์:บรรทัด |"
            echo "| --- | --- | --- |"
            jq -r '
              (.queries // [])
              | sort_by({"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"INFO":4}[.severity])
              | .[] | . as $q | .files[]
              | "| \($q.severity) | \($q.query_name) | `\(.file_name | sub("^(\\.\\./)*/?src/"; "")):\(.line)` |"
            ' "$f"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kics-results
          path: kics-results
  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install tools
        run: pip install -r requirements-ci.txt molecule==26.10.0 "molecule-plugins[docker]==26.11.0"
      - name: Install collections
        run: ansible-galaxy collection install -r collections/requirements.yml -p collections
      - name: molecule test
        env:
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"
        run: |
          failed=0
          found=0
          for dir in roles/*/molecule; do
            [ -d "$dir" ] || continue
            found=1
            role=$(basename "$(dirname "$dir")")
            echo "::group::molecule test ($role)"
            (cd "roles/$role" && molecule test) || failed=1
            echo "::endgroup::"
          done
          [ "$found" -eq 1 ] || echo "No role has a molecule directory yet, nothing to test"
          exit "$failed"
