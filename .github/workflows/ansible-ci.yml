name: "Ansible Security Scan"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      skip_molecule:
        description: "ข้าม molecule (สแกนเร็ว: lint / secrets / kics อย่างเดียว)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ansible-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ให้ ansible หา collection จาก ./collections เสมอ ไม่ว่า ansible.cfg จะตั้งอะไรไว้
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
  # pin ด้วย digest ที่ได้จาก log ของรันแรก (วันที่ 2026-11-03)
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  KICS_IMAGE: checkmarx/kics@sha256:ef29dbac14b046b1ef65f3280646112e927a61781c5f01bca1aeb723e0b96003

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install tools
        run: pip install -r requirements-ci.txt
      - name: Install collections
        run: ansible-galaxy collection install -r collections/requirements.yml -p collections
      - name: yamllint (workflow files)
        run: yamllint .github
      - name: ansible-lint
        if: ${{ !cancelled() }}
        run: ansible-lint
      - name: syntax-check
        if: ${{ !cancelled() }}
        run: |
          for f in playbooks/*.yml playbooks/*.yaml; do
            [ -f "$f" ] || continue
            echo "== $f"
            ansible-playbook "$f" --syntax-check -i localhost,
          done

  # ---- molecule: ทดสอบเฉพาะ role ที่ถูกแก้ ----
  # รันเฉพาะ: PR เข้า main / push เข้า main / กดรันเอง (workflow_dispatch = ทุก role,
  # ยกเว้นติ๊ก skip_molecule)
  # push ไป branch อื่นจะข้าม molecule (lint / secrets / kics ยังรันทุก push)
  # (ทดสอบทุก role: รัน workflow "Molecule (full)")
  molecule-detect:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && !inputs.skip_molecule) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: molecule detect changed roles
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.detect.outputs.scenarios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # ต้องมี history ไว้ git diff
      - name: Pick scenarios from changed files
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;; # workflow_dispatch -> รันทุก scenario
          esac
          scenarios=$(.github/scripts/detect-molecule-scenarios.sh "$base")
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          {
            echo "## Molecule scenarios (changed roles)"
            echo
            echo "\`$scenarios\`"
          } >> "$GITHUB_STEP_SUMMARY"

  molecule:
    needs: [lint, molecule-detect]
    if: >-
      needs.molecule-detect.result == 'success' &&
      needs.molecule-detect.outputs.scenarios != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.molecule-detect.outputs.scenarios) }}
    env:
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-molecule.txt
      - name: Install tools
        run: pip install -r requirements-ci.txt -r requirements-molecule.txt
      - name: Install collections
        run: |
          ansible-galaxy collection install -r collections/requirements.yml -p collections
          ansible-galaxy collection install -r molecule/requirements.yml -p collections
      - name: molecule test (${{ matrix.scenario }})
        run: molecule test -s "${{ matrix.scenario }}"

  # ใช้ job นี้เป็น required check ใน branch protection
  # (job molecule ราย role จะไม่เกิดขึ้นถ้า commit ไม่ได้แตะ role นั้น)
  molecule-result:
    name: molecule result
    needs: [molecule-detect, molecule]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check molecule result
        env:
          DETECT: ${{ needs.molecule-detect.result }}
          MOLECULE: ${{ needs.molecule.result }}
          SCENARIOS: ${{ needs.molecule-detect.outputs.scenarios }}
        run: |
          echo "detect=$DETECT molecule=$MOLECULE scenarios=$SCENARIOS"
          if [ "$DETECT" = skipped ]; then
            echo "ไม่รัน molecule กับ event นี้ (push ไป branch อื่น หรือกดรันแบบติ๊ก skip_molecule)"
            exit 0
          fi
          [ "$DETECT" = success ] || { echo "detect job ไม่สำเร็จ"; exit 1; }
          if [ "$SCENARIOS" = "[]" ]; then
            echo "ไม่มี role ที่ต้องทดสอบใน commit นี้"
            exit 0
          fi
          # มี role ต้องเทส แต่ molecule ไม่ได้รัน (เช่น lint ล้ม) หรือรันไม่ผ่าน = ล้ม
          [ "$MOLECULE" = success ] || { echo "molecule: $MOLECULE"; exit 1; }
          echo "ผ่านทุก scenario"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source /repo --redact --no-banner
      - name: vault files must be encrypted
        run: |
          files=$(git ls-files '*vault*.yml' '*vault*.yaml')
          [ -z "$files" ] && exit 0
          bad=$(grep -L '^\$ANSIBLE_VAULT' $files || true)
          [ -z "$bad" ] || { echo "Unencrypted vault files:"; echo "$bad"; exit 1; }

  kics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: KICS scan
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" "$KICS_IMAGE" scan \
            -p /src --type ansible --fail-on high \
            --exclude-paths /src/collections/ansible_collections \
            -o /src/kics-results --report-formats "json,sarif"
      - name: KICS summary
        if: always()
        run: |
          f=kics-results/results.json
          if [ ! -f "$f" ]; then
            echo "KICS: ไม่พบ $f" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## KICS scan"
            echo
            echo "| ระดับ | จำนวน |"
            echo "| --- | --- |"
            jq -r '(.severity_counters // {}) | to_entries[] | "| \(.key) | \(.value) |"' "$f"
            echo
            echo "| ระดับ | ปัญหา | ไฟล์:บรรทัด |"
            echo "| --- | --- | --- |"
            jq -r '
              (.queries // [])
              | sort_by({"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"INFO":4}[.severity])
              | .[] | . as $q | .files[]
              | "| \($q.severity) | \($q.query_name) | `\(.file_name | sub("^(\\.\\./)*/?src/"; "")):\(.line)` |"
            ' "$f"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kics-results
          path: kics-results
 