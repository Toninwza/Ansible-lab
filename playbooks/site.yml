- name: Setup Workers and Custom Nginx
  hosts: workers
  become: true
  tasks:
    - name: Clean old docker repo files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
        - /etc/apt/keyrings/docker.asc
        - /etc/apt/keyrings/docker.gpg

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-pip
        state: present
        update_cache: yes

    - name: Install Python Docker SDK
      ansible.builtin.pip:
        name:
          - requests
          - docker
        state: present
        executable: pip3

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG apt Key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker Repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable"
        state: present
        filename: docker

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Configure Docker to use vfs storage driver
      ansible.builtin.copy:
        content: '{"storage-driver": "vfs"}'
        dest: /etc/docker/daemon.json
      notify: Restart Docker

    - name: Start and enable Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create Nginx infrastructure directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/supalai-nginx/nginx
        - /opt/supalai-nginx/vhost.d
        - /var/log/nginx/reverse-proxy

    - name: Copy Nginx custom config files
      ansible.builtin.copy:
        src: "../files/nginx/{{ item }}"
        dest: "/opt/supalai-nginx/nginx/{{ item }}"
        mode: '0644'
      loop:
        - proxy.conf
        - proxy-wide.conf

    - name: Copy vhost.d configurations
      ansible.builtin.copy:
        src: "../files/vhost.d/"
        dest: /opt/supalai-nginx/vhost.d/
        mode: '0644'
      ignore_errors: true

    - name: Create external Docker network nginx_proxy
      community.docker.docker_network:
        name: nginx_proxy
        state: present

    - name: Run Supalai Nginx Proxy container
      community.docker.docker_container:
        name: nginx-proxy
        image: nginxproxy/nginx-proxy:1.7
        ports:
          - "82:82"
          - "80:80"
        volumes:
          - /var/run/docker.sock:/tmp/docker.sock:ro
          - /opt/supalai-nginx/nginx/proxy.conf:/etc/nginx/proxy.conf
          - /opt/supalai-nginx/nginx/proxy-wide.conf:/etc/nginx/conf.d/my_proxy.conf:ro
          - /var/log/nginx/reverse-proxy:/var/log/nginx
          - /opt/supalai-nginx/vhost.d:/etc/nginx/vhost.d:ro
        env:
          TZ: "Asia/Bangkok"
          ENABLE_IPV6: "true"
        networks:
          - name: nginx_proxy
        restart_policy: always
        recreate: yes

    - name: Create Portainer volume
      community.docker.docker_volume:
        name: portainer_data

    - name: Run Portainer CE
      community.docker.docker_container:
        name: portainer
        image: portainer/portainer-ce
        ports:
          - "9443:9443"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - portainer_data:/data
        restart_policy: always

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
