---
- name: Register target host
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add EC2 to dynamic group
      add_host:
        name: "{{ target_host }}"
        groups: dynamic

- name: On-demand server provisioning
  hosts: dynamic
  become: true
  vars:
    ansible_user: "{{ target_user | default('ubuntu') }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  pre_tasks:
    - name: Show install flags
      ansible.builtin.debug:
        msg: "docker={{ install_docker | default('undefined') }}, nginx={{ install_nginx_proxy | default('undefined') }}, portainer_server={{ install_portainer_server | default('undefined') }}, portainer_agent={{ install_portainer_agent | default('undefined') }}"
    - name: Check Docker binary exists
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_check

    - name: Fail with clear message if Docker is required but missing
      ansible.builtin.fail:
        msg: "Docker is required for the requested services but is not installed on this host. Set install_docker=true or confirm Docker is already installed."
      when:
        - not docker_check.stat.exists
        - not install_docker | bool
        - install_nginx_proxy | bool or install_portainer_server | bool or install_portainer_agent | bool
  roles:
    - role: docker_engine
      when: install_docker | bool

    - role: nginx_proxy
      when: install_nginx_proxy | bool
    
    - role: portainer_server
      when: install_portainer_server | bool

    - role: portainer_agent
      when: install_portainer_agent | bool
      
    - role : nvm
      when: install_nvm | default(false) | bool

    - role : dotnet
      when: install_dotnet | default(false) | bool

    - role: verify
      when: >
        install_docker | bool or
        install_nginx_proxy | bool or
        install_portainer_server | bool or
        install_portainer_agent | bool or
        install_nvm | bool or
        install_dotnet | bool